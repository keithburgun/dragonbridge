<title>Dragon Bridge</title>

<style>
/*FONTS*//* Layout: one screen. Opponent strip on top, the bridge lying sideways across the middle with face tokens on it,
   the table (deck, Nest, Dragon Power, Market, Hacks) under it, then the prompt and your hand at the bottom. */
:root{
  color-scheme:dark;
  --bg:#2a0710; --bg2:#3b0c18; --panel:#4a1220; --panel2:#5d1a2b; --line:#7c2c3f;
  --fg:#fff3df; --dim:#e0b9a8; --gold:#ffd86b; --gold2:#f0a93a; --teal:#35c6c0; --orange:#ff7a2f;
  --out:#120308; --good:#7be06a; --bad:#ff5a5a; --move:#3fbf7a; --bump:#4d8dff; --tp:#ff5fc0;
  --disp:'Cormorant Garamond','Palatino Linotype',Palatino,Georgia,serif;
  --body:'Fira Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --card:clamp(84px,min(12cqw,21cqh),154px); --mini:clamp(38px,5.2cqw,66px); --tok:clamp(22px,4.1cqw,50px); --dw:calc(var(--tok)*2);
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:400 15px/1.4 var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--disp);font-style:italic;font-weight:700;margin:0;text-wrap:balance;color:var(--gold)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto;
  background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg) 70%)}
/* Everything lives in #app, which is a size container: the layout responds to #app's size, not the window's.
   Mobile View makes #app a phone-shaped portrait column in the middle of the window. */
#app{position:relative;height:100%;margin-inline:auto;container-type:size;container-name:app;contain:layout size style;overflow:hidden}
body.mview{background:var(--out)}
@media (min-aspect-ratio:3/5){body.mview #app{aspect-ratio:9/19.5;max-width:100%;box-shadow:0 0 0 1px var(--line),0 0 60px #000}}   /* a real phone screen is already this shape */
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:.55em 1.2em;font-weight:600}
.btn:hover{border-color:var(--gold2)} .btn:focus-visible,.tbtn:focus-visible,.pick:focus-visible,.cardb:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.pri{background:linear-gradient(#ffd86b,#f0a93a);color:#3b0c18;border-color:#fff0b8}
.btn.sm{padding:.3em .8em;font-size:.86rem}
.btn[aria-pressed="true"]{background:var(--gold);color:#3b0c18;border-color:#fff0b8}
.lbl{color:var(--dim);font-size:.85rem}
/* title */
#title{align-items:center;justify-content:center;gap:14px;text-align:center}
#title .logo{width:min(46cqw,210px);aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 4px var(--gold2),0 12px 40px #0009}
#title h1{font-size:clamp(2.6rem,9cqw,4.6rem);line-height:.95;text-shadow:0 3px 0 #7a2a12,0 8px 24px #000a}
.tmenu{display:flex;flex-direction:column;gap:8px;width:min(100%,300px)}
.tbtn{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.7em;font-weight:600;font-size:1.05rem}
.tbtn:hover{background:var(--panel2);border-color:var(--gold2)} .tbtn.pri{background:linear-gradient(#ffd86b,#f0a93a);color:#3b0c18;border-color:#fff0b8}
/* setup */
.wrap{width:min(100%,900px);margin:0 auto;display:flex;flex-direction:column;gap:14px}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pick{display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 8px;min-width:0}
.pick[aria-pressed="true"]{border-color:var(--gold);background:var(--panel2)}
.pick img{width:42px;height:42px;border-radius:50%;flex:none}
.pick b{display:block;line-height:1.1} .pick span{font-size:.75rem;color:var(--dim)}
.info{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.info ul{margin:.3em 0 0;padding-left:1.1em} .info li{margin:.15em 0}
/* game */
#game{padding-block:6px;gap:10px;overflow:hidden;flex-direction:row}
#main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:4px;overflow-x:hidden;overflow-y:auto}
#logpane{display:none;flex:none;width:clamp(200px,20cqw,290px);flex-direction:column;gap:6px;background:#0003;border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:0}
#logpane h4{margin:0;font:800 .68rem/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
#loglive{flex:1 1 auto;overflow-y:auto;min-height:0}
@container app (orientation:landscape) and (min-width:900px){#logpane{display:flex} #ticker{display:none} #mebar [data-a="log"]{display:none}}
#goal{flex:none;text-align:center;background:var(--gold);color:#3b0c18;font-weight:800;border-radius:10px;padding:5px 10px;line-height:1.25}
#wingrow{flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:3px 10px;font-size:.82rem;min-height:26px}

.bar{display:flex;align-items:center;gap:8px;min-width:0;flex:none}

.wcount{display:flex;align-items:center;gap:2px;font-weight:800} .wcount img{height:clamp(16px,2.4cqw,24px);width:auto}
.items{display:flex;gap:3px;margin-left:auto;align-items:center;min-width:0}
.cardb{padding:0;border:0;background:none;border-radius:6px;line-height:0;position:relative;flex:none}

.eye svg{width:18px;height:12px;display:block}
.oppinfo .cardb img{width:calc(var(--mini)*.8)} .oppinfo .cardb{margin-right:3px}
.backs{display:flex} .backs img{width:calc(var(--mini)*.55);border-radius:4px;margin-left:-8px;box-shadow:0 1px 3px #0008} .backs img:first-child{margin-left:0}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn{margin-left:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.35em .7em;font-weight:600;flex:none}
#bridgewrap{position:relative;flex:none;padding-inline:calc(var(--dw) + 6px);margin-block:2px}
#bridge{position:relative;aspect-ratio:1890/426;background-size:100% 100%;border-radius:8px;box-shadow:0 6px 18px #000a}
.zone{position:absolute;top:0;bottom:0;width:23.81%;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;font:800 clamp(.5rem,1.3cqw,.8rem)/1 var(--body);letter-spacing:.12em;padding-bottom:2px;transition:left .9s}
.zone.threat{background:linear-gradient(#ff000055,#ff000022);color:#fff;box-shadow:inset 0 0 0 2px #ff3b3b;text-shadow:0 1px 2px #000}
.zone.exit{color:#eafff0;text-shadow:0 1px 3px #000,0 0 6px #000}
.tile{position:absolute;top:0;bottom:0;width:4.762%;border:0;background:none;padding:0}
.tile.can{cursor:pointer;background:#ffffff26;box-shadow:inset 0 0 0 3px var(--gold);animation:pulse 1.1s infinite alternate}

.tile.can.mv{background:#0a2a9c99;box-shadow:inset 0 0 0 3px #86b4ff;animation:pulseb 1.1s infinite alternate}
.tile.can.mv:hover,.tile.can.mv:focus-visible{background:#2f6bffcc}
@keyframes pulseb{from{background:#0a2a9c77}to{background:#1746d6b0}}
.tok{position:absolute;width:var(--tok);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);border:3px solid var(--teal);box-shadow:0 3px 8px #000c;transition:left .6s cubic-bezier(.3,1.25,.5,1),opacity .4s,filter .3s;pointer-events:none;z-index:3;background:#000}
.tok.squash{filter:grayscale(1) brightness(.55)} .tok.squash img{transform:scale(.8) rotate(-12deg);transition:transform .2s}
#bridge.shake{animation:shake .5s} @keyframes shake{10%,50%,90%{transform:translate(-5px,3px)}30%,70%{transform:translate(5px,-3px)}}
.tok img{width:100%;height:100%;border-radius:50%;display:block}
.tok.opp{border-color:var(--orange)} .tok.me{top:73%} .tok.opp{top:27%}
.tok.off{opacity:.25}
.tok .you{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);font:800 .6rem/1 var(--body);background:var(--teal);color:#00201f;padding:1px 4px;border-radius:4px}
.tok.opp .you{background:var(--orange);bottom:auto;top:-13px}
#dragon{position:absolute;top:50%;left:0;width:var(--dw);transform:translateY(-50%);z-index:4}
#dragon.flying #dpower{visibility:hidden}

#dragon.s1{left:100%;translate:-100% 0}
#dragon .dface{width:100%;aspect-ratio:1;border-radius:50%;border:4px solid var(--bad);box-shadow:0 0 22px #ff3b3b99,0 4px 10px #000c;background:none;padding:0;cursor:pointer}
#dragon .dface img{width:100%;height:100%;border-radius:50%;display:block}
#dpower .cardb img{width:calc(var(--dw)*.74);box-shadow:0 0 0 2px var(--orange),0 2px 8px #000c}
#table{flex:1 0 auto;display:flex;gap:10px;align-items:flex-start;align-content:flex-start;justify-content:center;flex-wrap:wrap;padding-block:2px}
.slot{display:flex;flex-direction:column;gap:3px;align-items:center;background:#0003;border:1px solid var(--line);border-radius:10px;padding:5px 7px}
.slot h4{margin:0;font:800 .68rem/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.slot .cards{display:flex;gap:4px;align-items:center;min-height:calc(var(--mini)*1.36)}
.nest .cards .cardb{margin-left:calc(var(--mini)*-.45)} .nest .cards .cardb:first-child{margin-left:0}
.meter{font-weight:800;font-size:.8rem;white-space:nowrap} .meter.hot{color:var(--bad)}
.empty{width:var(--mini);height:calc(var(--mini)*1.36);border:2px dashed var(--line);border-radius:6px;display:grid;place-items:center;color:var(--dim);font-size:.7rem;text-align:center}
#prompt{flex:none;display:flex;flex-direction:column;gap:5px;align-items:center;min-height:56px;justify-content:center;text-align:center}
#prompt .q{font-weight:800;font-size:clamp(.9rem,2cqw,1.1rem);color:var(--gold)}
#prompt .q.cpu{color:var(--dim);font-weight:600}
#prompt .opts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-height:30cqh;overflow:auto}
#ticker{font-size:.84rem;color:var(--dim);min-height:1.3em;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hand{flex:none;display:flex;gap:6px;justify-content:center;align-items:flex-end;min-height:calc(var(--card)*1.36)}
#hand .cardb img{width:var(--card);border-radius:8px}
#hand .cardb.can{transform:translateY(-6px);touch-action:none;cursor:grab} #hand .cardb.can img{outline:3px solid var(--gold);box-shadow:0 0 16px #ffd86bcc}
#hand .cardb.drag{z-index:30;cursor:grabbing} #hand .cardb.drag.drop img{outline-color:var(--good);box-shadow:0 0 22px #7be06acc}
#hand.many .cardb{margin-left:calc(var(--card)*-.28)} #hand.many .cardb:first-child{margin-left:0}
#peek{position:fixed;z-index:60;pointer-events:none;display:none} #peek img{width:min(300px,34cqh);border-radius:14px;box-shadow:0 0 0 3px var(--gold2),0 16px 44px #000e;display:block}
#hand .cardb.no img{filter:brightness(.6)}
/* overlays */
.ov{position:fixed;inset:0;background:#12030899;display:none;align-items:center;justify-content:center;z-index:50;padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.ov.show{display:flex}
.sheet{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:min(760px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 60px #000c}
.sheet .acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.zoom{align-items:center;text-align:center} .zoom img{max-height:62cqh;width:auto;max-width:100%;border-radius:14px;box-shadow:0 10px 30px #000c}
.zoom p{margin:0;max-width:46ch}
#splash{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;z-index:40;transition:transform .25s,opacity .25s;text-align:center}

#splash img{width:min(52cqw,230px);border-radius:14px;box-shadow:0 0 0 4px var(--orange),0 16px 50px #000e}

#banner{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);z-index:41;font:italic 700 clamp(2rem,8cqw,4rem)/1 var(--disp);color:var(--gold);text-shadow:0 4px 0 #7a2a12,0 0 30px #000;opacity:0;pointer-events:none;transition:opacity .3s;text-align:center}
#banner.on{opacity:1}
#banner div{white-space:nowrap} #banner .l2{font-size:1.25em;color:#fff3df;margin-top:.15em;animation:pop .45s cubic-bezier(.3,1.6,.5,1)} @keyframes pop{from{transform:scale(.3);opacity:0}}
#banner.big{top:40%;font-size:clamp(1.5rem,6.2cqw,3.4rem);background:radial-gradient(closest-side,#000d 55%,#0000);padding:1.4em 2.4em}
#coach{position:fixed;left:50%;bottom:calc(var(--card)*1.36 + 90px);transform:translateX(-50%);z-index:45;background:#fff3df;color:#2a0710;border-radius:14px;padding:10px 14px;max-width:min(92cqw,520px);box-shadow:0 10px 30px #000c;border:3px solid var(--gold2)}
#coach p{margin:0 0 8px}
.log{font-size:.88rem;display:flex;flex-direction:column;gap:2px} .log .t{color:var(--gold);font-weight:800;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.grid .cardb img{width:100%} .grid figure{margin:0;text-align:center;font-size:.78rem;color:var(--dim)}
table.st{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums} table.st td,table.st th{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left} table.st td:not(:first-child),table.st th:not(:first-child){text-align:right}
.ach{display:flex;gap:10px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel)} .ach.off{opacity:.45}
.ach i{font-style:normal;font-size:1.3rem;width:1.6em;text-align:center}
.bracket{display:flex;gap:12px;overflow-x:auto} .bracket div{display:flex;flex-direction:column;gap:8px;justify-content:space-around;min-width:130px}
.bracket span{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:.85rem;white-space:nowrap} .bracket span.w{border-color:var(--gold);color:var(--gold)} .bracket span.me{background:var(--panel2);font-weight:800}
.man img{width:100%;border-radius:8px;display:block;margin-bottom:8px}
@container app (max-width:640px){
  .iconbtn{margin-left:2px;padding:.3em .5em;font-size:.85rem} .bar{gap:5px}
  body{font-size:14px} #table{gap:5px} .slot{padding:3px 4px} .slot h4{font-size:.58rem;letter-spacing:.04em}
  .bar .who span{display:none} #bridgewrap{padding-inline:0;padding-top:calc(var(--dw)*1.05)} #dragon{top:0;transform:none;width:auto} #dragon .dfly{flex-direction:row} #dragon.s1 .dfly{flex-direction:row-reverse} #dragon .dface{width:var(--dw)} #dpower .cardb img{width:calc(var(--dw)*.7)} #bridge{aspect-ratio:1890/620}
  #app > *{--card:22.5cqw;--mini:10.2cqw;--tok:6.2cqw;--dw:11cqw} #hand{gap:3px}
}
@container app (max-height:560px){#app > *{--card:clamp(64px,19cqh,120px);--mini:clamp(30px,8.5cqh,56px)} #prompt{min-height:40px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
const IMG = /*IMGS*/{};
const MANUAL_PAGES = /*MANUAL_PAGES*/0;
'use strict';
const $ = s => document.querySelector(s), esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
/* Which edition's cards to show: the running match's, otherwise the setting (the Card Library can override it). */
let viewEd = 0;
const curEd = () => M ? (M.G.S.ed === 2 ? 2 : 1) : viewEd || (P.opt.ed2 ? 2 : 1);
const im = id => (curEd() === 2 && IMG[id + '_2e']) || IMG[id] || '';
const face = w => im('face_' + w);
const cardImg = (kind, id) => im(kind === 'wiz' ? 'wz_' + id : kind === 'item' ? 'it_' + id : kind === 'hack' ? 'hk_' + id : id);
const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

/* ---------- profile (saved in this browser) ---------- */
const DEF = {opt: {mview: false, ed2: true, speed: 1, sound: true, oneTap: false, tips: false, wiz: 'derby', opp: 'random', level: 'normal', mode: 'versus'}, st: {}, wz: {}, ach: {}, elo: 1000, bestElo: 1000, rankGames: 0, daily: {}, pz: {}, trophies: 0, tutDone: false, seen: {}};

}

  const wizInfo = w => `<div class="info"><b>${esc(WIZ[w].n)}</b> <span class="lbl">${esc(WIZ[w].title)}</span> <button class="btn sm" data-a="zoomwiz" data-id="${w}">See card</button><ul>${wizLines(w, curEd()).map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>`;
  if (mode === 'versus') {
    h += `<div class="row"><button class="btn pri" data-a="launch" style="font-size:1.1rem;padding:.6em 2em">Start match</button>${levels}<label class="row" style="gap:6px"><input type="checkbox" id="opt-tips" data-t="tips" ${o.tips ? 'checked' : ''}> <b>Expert Tips</b> <span class="lbl">ask the Expert CPU what it would do</span></label>${edBox}</div>
      <h3>Your Wizard</h3>${pickRow(o.wiz, 'setwiz')}${wizInfo(o.wiz)}<h3>Opponent</h3>${pickRow(o.opp, 'setopp', true, o.wiz)}${o.opp !== 'random' ? wizInfo(o.opp) : ''}`;
  } else if (mode === 'tour') {
    const T = P.tour;
    h += T ? `<div class="info"><b>Tournament in progress</b> · ${['Quarterfinal', 'Semifinal', 'Final'][T.round]} vs ${esc(WIZ[tourOpp(T)].n)}</div>${bracketHtml(T)}<div class="row"><button class="btn pri" data-a="tourgo">Play ${['Quarterfinal', 'Semifinal', 'Final'][T.round]}</button><button class="btn" data-a="tourquit">Abandon Tournament</button></div>`
      : `<p class="lbl" style="margin:0">Eight Wizards, single elimination. Win three matches to take the trophy. The Final is one difficulty level harder.</p><div class="row"><button class="btn pri" data-a="launch" style="font-size:1.1rem;padding:.6em 2em">Start Tournament</button>${levels}${edBox}</div><h3>Your Wizard</h3>${pickRow(o.wiz, 'setwiz')}${wizInfo(o.wiz)}`;
  } else if (mode === 'ranked') {
    const r = rankOf(P.elo);
    h += `<div class="info"><b>Rank ${r}</b> of 10 · Elo ${P.elo} <span class="lbl">(best ${P.bestElo}, ${P.rankGames} games)</span><br><span class="lbl">Opponents are picked near your rating; higher ranks play stronger CPUs. Every 100 Elo is a rank.</span></div>
      <div class="row"><button class="btn pri" data-a="launch" style="font-size:1.1rem;padding:.6em 2em">Find a match</button>${edBox}</div><h3>Your Wizard</h3>${pickRow(o.wiz, 'setwiz')}${wizInfo(o.wiz)}`;
  } else if (mode === 'daily') {
    const d = dailyToday(), rec = P.daily[d.day];
    h += `<div class="info"><b>${d.day}</b> · You are <b>${esc(WIZ[d.wiz[0]].n)}</b> against <b>${esc(WIZ[d.wiz[1]].n)}</b> (${LEVEL_NAMES[d.level]} CPU). Everyone gets the same Wizards and the same shuffle today, with 2nd Edition rules.<br>${rec ? `Today: <b>${rec === 'W' ? 'Won' : 'Lost'}</b>.` : 'Not played yet.'} Streak: ${dailyStreak()}.</div>
      <div class="row"><button class="btn pri" data-a="launch" style="font-size:1.1rem;padding:.6em 2em">${rec ? 'Replay for fun' : 'Play today’s challenge'}</button></div>${wizInfo(d.wiz[0])}${wizInfo(d.wiz[1])}`;
  } else {
    h += `<p class="lbl" style="margin:0">Each puzzle has one goal, shown at the top of the screen.</p>
      <div class="picks">${PUZZLES.map((z, i) => `<button class="pick" data-a="pzgo" data-id="${z.id}"><img src="${face(z.snap.wiz[0])}" alt=""><div><b>${P.pz[z.id] ? '✓ ' : ''}Puzzle ${i + 1}</b><span>${esc(puzzleGoal(z))}</span></div></button>`).join('') || '<span class="lbl">No puzzles yet.</span>'}</div>`;
  }
  $('#setupbody').innerHTML = h;
}

/* ---------- sheets ---------- */
function librarySheet(tab = 'act') {
  librarySheet.tab = tab; const ed = curEd();
  const tabs = [['act', 'Actions'], ['wiz', 'Wizards'], ['item', 'Items'], ['hack', 'Bridge Hacks'], ['other', 'Other']];
  const fig = (kind, id, name) => `<figure><button class="cardb" data-a="zoom${kind}" data-id="${id}" data-lib="${tab}"><img src="${cardImg(kind, id)}" alt="${esc(name)}"></button>${esc(name)}</figure>`;
  let g = '';
  if (tab === 'act') g = Object.keys(ACTIONS).map(c => fig('card', c, ACTIONS[c].n + (DECK.filter(x => x === c).length > 1 ? ' ×2' : ''))).join('');
  if (tab === 'wiz') g = WIZ_IDS.map(w => fig('wiz', w, WIZ[w].n)).join('') + (ed === 2 ? '' : fig('wiz', 'may2', 'May (reverse)'));
  if (tab === 'item') g = Object.keys(ITEMS).map(i => fig('item', i, ITEMS[i].n)).join('');
  if (tab === 'hack') g = Object.keys(HACKS).map(i => fig('hack', i, HACKS[i].n)).join('');
  if (tab === 'other') g = [['gem', 'Green Gem'], ['gemdep', 'Depleted Gem'], ['white', 'White Gem'], ['dragon', 'The Dragon'], ['ref', 'Turn reference']].map(([id, n]) => `<figure><button class="cardb" data-a="zoomimg" data-id="${id}" data-n="${n}"><img src="${im(id)}" alt="${n}"></button>${n}</figure>`).join('');
  openOv(`<div class="row"><h2>Card Library</h2><span class="seg">${tabs.map(([t, l]) => `<button class="btn sm" data-a="libtab" data-v="${t}" aria-pressed="${t === tab}">${l}</button>`).join('')}</span>${M ? `<span class="lbl">${ed === 2 ? '2nd' : '1st'} Edition (this match)</span>` : `<span class="seg">${[[2, '2nd Edition'], [1, '1st Edition']].map(([e, l]) => `<button class="btn sm" data-a="libed" data-v="${e}" aria-pressed="${e === ed}">${l}</button>`).join('')}</span>`}</div><div class="grid">${g}</div><div class="acts"><button class="btn" data-a="close">Close</button></div>`);
}
function statsSheet() {
  const rows = [], tot = {w: 0, l: 0};
  for (const [k, v] of Object.entries(P.st)) { const [m, l] = k.split(':'); rows.push(`<tr><td>${{versus: 'Versus', tour: 'Tournament', ranked: 'Ranked', daily: 'Daily Challenge'}[m] || m}${l ? ' · ' + LEVEL_NAMES[l] : ''}</td><td>${v.w}</td><td>${v.l}</td></tr>`); tot.w += v.w; tot.l += v.l; }
  const wz = WIZ_IDS.filter(w => P.wz[w]).map(w => `<tr><td>${esc(WIZ[w].n)}</td><td>${P.wz[w].w}</td><td>${P.wz[w].l}</td></tr>`).join('');
  const na = ACH.filter(a => P.ach[a[0]]).length;
  openOv(`<h2>Stats</h2><div class="info">Matches: <b>${tot.w + tot.l}</b> · Wins: <b>${tot.w}</b> · Ranked: <b>Rank ${rankOf(P.elo)}</b> (Elo ${P.elo}) · Trophies: <b>${P.trophies}</b> · Daily streak: <b>${dailyStreak()}</b> · Puzzles: <b>${PUZZLES.filter(z => P.pz[z.id]).length}/${PUZZLES.length}</b></div>
    ${rows.length ? `<table class="st"><tr><th>Mode</th><th>Won</th><th>Lost</th></tr>${rows.join('')}</table>` : '<p class="lbl">No matches played yet.</p>'}
    ${wz ? `<table class="st"><tr><th>Wizard</th><th>Won</th><th>Lost</th></tr>${wz}</table>` : ''}
    <h3>Achievements ${na}/${ACH.length}</h3>${ACH.map(a => `<div class="ach ${P.ach[a[0]] ? '' : 'off'}"><i>${a[1]}</i><div><b>${a[2]}</b><br><span class="lbl">${a[3]}</span></div></div>`).join('')}
    <div class="acts"><button class="btn" data-a="close">Close</button></div>`);
}
function optionsSheet() {
  const o = P.opt;
  openOv(`<h2>Options</h2>
    <div class="row"><b>CPU animation</b><span class="seg">${[[1.6, 'Slow'], [1, 'Normal'], [.5, 'Fast'], [0, 'Instant']].map(([v, l]) => `<button class="btn sm" data-a="setspeed" data-v="${v}" aria-pressed="${o.speed === v}">${l}</button>`).join('')}</span></div>
    <label class="row" style="gap:6px"><input type="checkbox" id="opt-ed2o" data-t="ed2" ${o.ed2 ? 'checked' : ''}> <b>2nd Edition rules</b> <span class="lbl">for new matches; a match in progress keeps its edition</span></label>
    <label class="row" style="gap:6px"><input type="checkbox" id="opt-mview" data-t="mview" ${o.mview ? 'checked' : ''}> <b>Mobile View</b> <span class="lbl">play in a phone-shaped portrait layout</span></label>
    <label class="row" style="gap:6px"><input type="checkbox" id="opt-sound" data-t="sound" ${o.sound ? 'checked' : ''}> <b>Sound</b></label>
    <label class="row" style="gap:6px"><input type="checkbox" id="opt-onetap" data-t="oneTap" ${o.oneTap ? 'checked' : ''}> <b>One-tap cards</b> <span class="lbl">play a card without the enlarged preview first</span></label>
    <div class="row"><button class="btn sm" data-a="wipe1">Erase all progress…</button></div>
    <div class="acts"><button class="btn pri" data-a="close">Done</button></div>`);
}
function rulebookSheet() { let h = '<div class="row"><h2>Rulebook</h2><button class="btn sm" data-a="close">Close</button></div><div class="man">'; for (let i = 1; i <= MANUAL_PAGES; i++) h += `<img loading="lazy" src="${im('manual_' + String(i).padStart(2, '0'))}" alt="Rulebook page ${i}">`; openOv(h + '</div><div class="acts"><button class="btn" data-a="close">Close</button></div>'); }
function logSheet() {
  const h = logHtml(M.G.S.log);
  openOv(`<div class="row"><h2>Match log</h2><button class="btn sm" data-a="close">Close</button></div><div class="log">${h}</div>`); const s = $('#sheet'); s.scrollTop = s.scrollHeight;
}
function menuSheet() {
  openOv(`<h2>Menu</h2><div class="tmenu" style="margin:0 auto"><button class="tbtn pri" data-a="close">Back to the match</button><button class="tbtn" data-a="zoomimg" data-id="ref" data-n="Turn reference">Turn reference card</button><button class="tbtn" data-a="rulebook">Rulebook</button><button class="tbtn" data-a="library">Card Library</button><button class="tbtn" data-a="options">Options</button>
    ${M.cfg.puzzle ? '<button class="tbtn" data-a="again">Restart puzzle</button><button class="tbtn" data-a="totitle">Quit to title</button>' : '<button class="tbtn" data-a="totitle">Save &amp; quit to title</button><button class="tbtn" data-a="resign">Resign</button>'}</div>`);
}
function toTitle() { M = null; closeOv(); $('#contbtn').hidden = !store.get('db_save'); $('#playbtn').classList.toggle('pri', !store.get('db_save')); show('title'); }

/* ---------- input ---------- */
document.addEventListener('click', ev => {
  if (Date.now() - dragAt < 350) return;   // the click that ends a drag
  const b = ev.target.closest('[data-a]'); if (!b) { if (ev.target.id === 'ov') closeOv(); return; }
  hidePeek();
  const a = b.dataset.a, v = b.dataset.v, id = b.dataset.id;
  if (a === 'ans') { if (M && !M.busy) answer(+b.dataset.i); return; }
  if (b.dataset.ci != null && M && !M.busy && M.G.req && M.G.req.p === HUMAN) return chooseCard(+b.dataset.ci);
  switch (a) {
    case 'close': closeOv(); break;
    case 'sub': if (M) { M.sub = v || null; render(); } break;
    case 'zoomok': { const f = zoomCb; closeOv(); if (f) f(); break; }
    case 'hand': case 'zoomcard': zoomThing(id in ACTIONS ? 'card' : 'card', id); break;
    case 'zoomitem': zoomThing('item', id); break;
    case 'zoomhack': zoomThing('hack', id); break;
    case 'zoomwiz': zoomThing('wiz', id); break;
    case 'zoomimg': zoom(im(id), b.dataset.n); break;
    case 'zoomdragon': zoom(im('dragon'), 'The Dragon', M ? `Flight at ${flightNeed(M.G.S)} Wings (now ${wings(M.G.S)}). Roost at 7 cards. The five orange tiles on the Dragon’s side are Threatened.` : ''); break;
    case 'play': if (P.opt.mode === 'puzzle' || true) { show('setup'); closeOv(); M = null; drawSetup(); } break;
    case 'cont': resumeMatch(); break;
    case 'tutorial': startMatch({mode: 'versus', wiz: ['derby', 'eve'], level: 'easy', tutorial: true, first: 0, tips: true}); break;
    case 'library': librarySheet(); break;
    case 'libtab': librarySheet(v); break;
    case 'libed': viewEd = +v; librarySheet(librarySheet.tab); break;
    case 'rulebook': rulebookSheet(); break;
    case 'stats': statsSheet(); break;
    case 'options': optionsSheet(); break;
    case 'totitle': toTitle(); break;
    case 'setmode': P.opt.mode = v; saveProf(); drawSetup(); break;
    case 'setwiz': P.opt.wiz = v; if (P.opt.opp === v) P.opt.opp = 'random'; saveProf(); drawSetup(); break;   // no mirror matches
    case 'setopp': P.opt.opp = v === P.opt.wiz ? 'random' : v; saveProf(); drawSetup(); break;
    case 'setlevel': P.opt.level = v; saveProf(); drawSetup(); break;
    case 'setspeed': P.opt.speed = +v; saveProf(); optionsSheet(); break;
    case 'launch': launch(); break;
    case 'tourgo': tourGo(); break;
    case 'tourquit': P.tour = null; saveProf(); drawSetup(); break;
    case 'rankgo': rankGo(); break;
    case 'pzgo': puzzleGo(id); break;
    case 'again': { const c = M.cfg; if (c.mode === 'tour' || c.mode === 'ranked') { show('setup'); closeOv(); drawSetup(); } else startMatch(Object.assign({}, c, c.mode === 'versus' && P.opt.opp === 'random' && !c.tutorial ? {wiz: [c.wiz[0], randWiz(c.wiz[0])]} : {})); break; }
    case 'tip': tip(); break;
    case 'undo': undo(); break;
    case 'log': logSheet(); break;
    case 'menu': menuSheet(); break;
    case 'coachok': $('#coach').hidden = true; break;
    case 'resign': openOv('<h2>Resign this match?</h2><p>It counts as a loss.</p><div class="acts"><button class="btn" data-a="resign2">Resign</button><button class="btn pri" data-a="close" autofocus>Keep playing</button></div>'); break;
    case 'resign2': M.G.S.winner = 1; M.G.S.reason = 'resign'; M.G.req = null; closeOv(); render(); finish(); break;
    case 'wipe1': openOv('<h2>Erase all progress?</h2><p>This permanently erases your stats, achievements, rank, trophies and any match in progress in this browser.</p><div class="acts"><button class="btn" data-a="wipe2">Erase everything</button><button class="btn pri" data-a="close" autofocus>Cancel</button></div>'); break;
    case 'wipe2': store.del('db_profile'); store.del('db_save'); P = clone(DEF); applyView(); toTitle(); break;
  }
});
document.addEventListener('change', ev => { const t = ev.target.dataset && ev.target.dataset.t; if (!t) return; P.opt[t] = ev.target.checked; saveProf(); if (t === 'mview') applyView(); if (t === 'ed2' && !M) { if (!$('#setup').hidden) drawSetup(); if ($('#ov').classList.contains('show')) optionsSheet(); } });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { if ($('#ov').classList.contains('show')) closeOv(); else if (M && !M.G.over) menuSheet(); } });

/* ---------- start ---------- */
const PUZZLES = /*PUZZLES*/[];
loadProf();
if (P.opt.opp === P.opt.wiz) P.opt.opp = 'random';
function applyView() { document.body.classList.toggle('mview', !!P.opt.mview); hidePeek(); }
applyView();
$('#tlogo').src = im('logo');
try { if (typeof APP_VERSION === 'string') $('#ver').textContent = '· ' + APP_VERSION; } catch (e) {}
toTitle();
</script>
