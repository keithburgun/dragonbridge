name: Upload to itch.io

# Re-uploads the latest GitHub Release (Android, Windows, Linux and browser builds) to itch.io without rebuilding.
# Run it from Actions → Upload to itch.io → Run workflow, for example right after adding the BUTLER_API_KEY secret.
on:
  workflow_dispatch:

jobs:
  itch:
    name: Upload latest release to itch.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_GAME: ${{ vars.ITCH_GAME || 'keithburgungames/dragon-bridge-digital' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the itch.io key
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then echo "::error::Add the BUTLER_API_KEY secret in this repo's settings (see README)."; exit 1; fi
      - uses: actions/checkout@v4
      - name: Download the latest release
        run: |
          TAG=$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName)
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"; echo "Latest release: $TAG"
          gh release download "$TAG" --repo "${{ github.repository }}" --dir out --pattern 'DragonBridge-*'
      - name: Upload to itch.io
        run: bash .github/scripts/itch_upload.sh "$(ls out/*.apk | head -1)" "$(ls out/*.exe | head -1)" "$(ls out/*-web.zip | head -1)" "$VERSION" "$(ls out/*.AppImage 2>/dev/null | head -1)"
