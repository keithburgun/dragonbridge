name: Build Dragon Bridge

# Builds the browser version, the Android APK, the Windows .exe and the Linux AppImage (Steam Deck) from source/,
# publishes them as a GitHub Release, and uploads all four to itch.io. Runs on every change to main (except README-type edits), or by hand from
# Actions → Build Dragon Bridge → Run workflow. A hand-started run on another branch only builds (no release, no upload).
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.gitignore', '.github/workflows/itch.yml']
  workflow_dispatch:

concurrency:
  group: build-dragonbridge
  cancel-in-progress: true

permissions:
  contents: write   # to publish the GitHub Release

env:
  VERSION: 1.0.${{ github.run_number }}
  TAG: v1.0.${{ github.run_number }}
  GH_TOKEN: ${{ github.token }}

jobs:
  web:
    name: Browser version (and rules tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the game from source
        run: DRAGONBRIDGE_VERSION="$VERSION" python3 source/build.py
      - name: Rules tests (a failing test stops the release)
        run: |
          node source/tests/fuzz.js 1
          node source/tests/known.js
          node source/tests/ed2.js
          node source/tests/puzzle_draws.js
          node source/tests/ai_sense.js
      - uses: actions/upload-artifact@v4
        with:
          name: web
          retention-days: 3
          path: |
            www/index.html
            source/dist/dragonbridge-web.zip

  android:
    name: Android APK
    needs: [web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install packages
        run: npm ci
      - name: Create the Android project and apply Dragon Bridge branding
        run: |
          npx cap add android
          cp -r branding/res/. android/app/src/main/res/
          # the game runs in portrait on phones
          sed -i 's#android:name=".MainActivity"#android:name=".MainActivity" android:screenOrientation="portrait"#' android/app/src/main/AndroidManifest.xml
          grep -q 'android:screenOrientation="portrait"' android/app/src/main/AndroidManifest.xml
          # in-app updates: our UpdaterPlugin downloads the new APK and opens Android's installer; MainActivity registers it
          test -f android/app/src/main/java/com/dragonbridge/game/MainActivity.java
          cp branding/java/MainActivity.java branding/java/UpdaterPlugin.java android/app/src/main/java/com/dragonbridge/game/
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />#' android/app/src/main/AndroidManifest.xml
          grep -q REQUEST_INSTALL_PACKAGES android/app/src/main/AndroidManifest.xml
          grep -q 'fileprovider' android/app/src/main/AndroidManifest.xml   # (Capacitor's own FileProvider hands the APK to the installer)
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          npx cap sync android
      - name: Build the APK (release build)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Sign it (with the key in the repo's secrets; never in the code)
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$ANDROID_KEYSTORE" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > "$KS"
          else
            # No signing key yet: sign with a throwaway key so the APK still installs. Each build then has a different
            # signature, so Android will refuse to install one build over another until the secrets are added.
            echo "::warning title=Android signing key missing::Signed with a one-off key. Add the ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD secrets so updates install over older versions (see README)."
            export ANDROID_KEYSTORE_PASSWORD=temporary-key
            keytool -genkeypair -keystore "$KS" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEYSTORE_PASSWORD" -alias temporary -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Dragon Bridge (temporary key)" >/dev/null 2>&1
          fi
          ALIAS=$(keytool -list -keystore "$KS" -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null | grep -i 'PrivateKeyEntry' | head -1 | cut -d, -f1)
          test -n "$ALIAS" || { echo "::error title=Android signing::Couldn't read a key from ANDROID_KEYSTORE (wrong password, or not a base64 keystore?)"; exit 1; }
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --ks-key-alias "$ALIAS" --out "DragonBridge-$VERSION.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "DragonBridge-$VERSION.apk" | head -3
          rm -f "$KS"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          retention-days: 3
          path: DragonBridge-${{ env.VERSION }}.apk

  windows:
    name: Windows EXE
    needs: [web]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy the game into the desktop app
        run: |
          mkdir -p desktop/app
          cp www/index.html desktop/app/index.html
      - name: Install packages
        working-directory: desktop
        run: |
          npm ci
          npm version "$VERSION" --no-git-tag-version --allow-same-version
      - name: Build DragonBridge.exe
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          retention-days: 3
          path: desktop/dist/DragonBridge-${{ env.VERSION }}.exe

  linux:
    name: Linux AppImage (Steam Deck)
    needs: [web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy the game into the desktop app
        run: |
          mkdir -p desktop/app
          cp www/index.html desktop/app/index.html
      - name: Install packages
        working-directory: desktop
        run: |
          npm ci
          npm version "$VERSION" --no-git-tag-version --allow-same-version
      - name: Build DragonBridge.AppImage
        working-directory: desktop
        run: npx electron-builder --linux AppImage --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          retention-days: 3
          path: desktop/dist/DragonBridge-${{ env.VERSION }}.AppImage

  release:
    name: Publish release and upload to itch.io
    if: github.ref == 'refs/heads/main'
    needs: [web, android, windows, linux]
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}                                # itch.io API key (repo secret)
      ITCH_GAME: ${{ vars.ITCH_GAME || 'keithburgungames/dragon-bridge-digital' }}   # itch.io user/game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Collect the four builds
        run: |
          mkdir out
          cp art/android/*.apk art/windows/*.exe art/linux/*.AppImage out/
          cp art/web/source/dist/dragonbridge-web.zip "out/DragonBridge-$VERSION-web.zip"
          ls -la out
      - name: Publish the GitHub Release
        run: |
          gh release create "$TAG" out/* --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest \
            --title "Dragon Bridge $VERSION" \
            --notes "Built from commit ${{ github.sha }}. **DragonBridge-$VERSION.apk** for Android, **DragonBridge-$VERSION.exe** for Windows, **DragonBridge-$VERSION.AppImage** for Linux and the Steam Deck, **DragonBridge-$VERSION-web.zip** to play in a browser (unzip and open index.html)."
      - name: Upload to itch.io
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::warning title=itch.io upload skipped::Add the BUTLER_API_KEY secret in this repo's settings (see README). The builds are on the GitHub Release."; exit 0; fi
          bash .github/scripts/itch_upload.sh "out/DragonBridge-$VERSION.apk" "out/DragonBridge-$VERSION.exe" "out/DragonBridge-$VERSION-web.zip" "$VERSION" "out/DragonBridge-$VERSION.AppImage"
